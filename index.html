<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
		<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="iOS APN">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>iOS APN Profiles</title>
		<link rel="manifest" href="./manifest.json">
		<link rel="icon" href="./icon.svg" type="image/svg+xml">
		<link rel="apple-touch-icon" href="./apple-touch-icon.png">
		<style>
			:root {
				color-scheme: light dark;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				--page-background: #f6f8fb;
				--page-gradient: linear-gradient(180deg, #ffffff 0%, #eef3f8 100%);
				--accent-glow: rgba(15, 118, 110, 0.16);
				--text: #172033;
				--muted-text: #526174;
				--card-background: rgba(255, 255, 255, 0.86);
				--card-border: rgba(148, 163, 184, 0.3);
				--card-shadow: rgba(15, 23, 42, 0.08);
				--link-background: #ffffff;
				--link-border: #d8e2ed;
				--link-hover: #0f766e;
				--link-shadow: rgba(15, 118, 110, 0.16);
				--badge-background: #ecfeff;
				--badge-text: #0f766e;
				background: var(--page-background);
				color: var(--text);
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				background:
					radial-gradient(circle at top left, var(--accent-glow), transparent 32rem),
					var(--page-gradient);
			}

			main {
				width: min(100%, 760px);
				margin: 0 auto;
				padding: 40px 20px 56px;
			}

			header {
				margin-bottom: 28px;
			}

			h1 {
				margin: 0;
				font-size: clamp(2rem, 7vw, 3.35rem);
				line-height: 1.05;
				letter-spacing: 0;
			}

			.lead {
				margin: 12px 0 0;
				color: var(--muted-text);
				font-size: 1rem;
				line-height: 1.6;
			}

			.carrier-list {
				display: grid;
				gap: 18px;
			}

			.carrier {
				background: var(--card-background);
				border: 1px solid var(--card-border);
				border-radius: 8px;
				box-shadow: 0 18px 45px var(--card-shadow);
				padding: 18px;
			}

			.carrier h2 {
				margin: 0 0 12px;
				font-size: 1.05rem;
				letter-spacing: 0;
			}

			.profile-grid {
				display: grid;
				gap: 10px;
				grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			}

			.profile-link {
				display: flex;
				align-items: center;
				justify-content: space-between;
				min-height: 58px;
				padding: 14px 15px;
				border: 1px solid var(--link-border);
				border-radius: 8px;
				background: var(--link-background);
				color: var(--text);
				text-decoration: none;
				transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
			}

			.profile-link:hover,
			.profile-link:focus-visible {
				border-color: var(--link-hover);
				box-shadow: 0 10px 24px var(--link-shadow);
				transform: translateY(-1px);
				outline: none;
			}

			.profile-name {
				font-weight: 700;
			}

			.profile-kind {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 44px;
				min-height: 28px;
				padding: 4px 9px;
				border-radius: 999px;
				background: var(--badge-background);
				color: var(--badge-text);
				font-size: 0.78rem;
				font-weight: 800;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--page-background: #0b1020;
					--page-gradient: linear-gradient(180deg, #141b2d 0%, #090d18 100%);
					--accent-glow: rgba(45, 212, 191, 0.18);
					--text: #f5f7fb;
					--muted-text: #bac4d3;
					--card-background: rgba(22, 30, 48, 0.88);
					--card-border: rgba(148, 163, 184, 0.22);
					--card-shadow: rgba(0, 0, 0, 0.34);
					--link-background: rgba(13, 20, 34, 0.92);
					--link-border: rgba(148, 163, 184, 0.28);
					--link-hover: #5eead4;
					--link-shadow: rgba(45, 212, 191, 0.18);
					--badge-background: rgba(45, 212, 191, 0.16);
					--badge-text: #99f6e4;
				}
			}

			@media (max-width: 520px) {
				main {
					padding: 28px 14px 40px;
				}

				.carrier {
					padding: 14px;
				}

				.profile-grid {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<h1>iOS APN Profiles</h1>
				<p class="lead">필요한 통신사와 네트워크를 선택해 APN 구성 프로파일을 설치하세요.</p>
			</header>

			<div class="carrier-list">
				<section class="carrier" aria-labelledby="kt-title">
					<h2 id="kt-title">KT</h2>
					<div class="profile-grid">
						<a class="profile-link" href="./kt_3g.mobileconfig">
							<span class="profile-name">KT</span>
							<span class="profile-kind">3G</span>
						</a>
						<a class="profile-link" href="./kt_lte.mobileconfig">
							<span class="profile-name">KT</span>
							<span class="profile-kind">LTE</span>
						</a>
						<a class="profile-link" href="./kt_5g.mobileconfig">
							<span class="profile-name">KT</span>
							<span class="profile-kind">5G</span>
						</a>
					</div>
				</section>

				<section class="carrier" aria-labelledby="sk-title">
					<h2 id="sk-title">SK Telecom</h2>
					<div class="profile-grid">
						<a class="profile-link" href="./sktelecom_3g.mobileconfig">
							<span class="profile-name">SK Telecom</span>
							<span class="profile-kind">3G</span>
						</a>
						<a class="profile-link" href="./sktelecom_apple.mobileconfig">
							<span class="profile-name">SK Telecom</span>
							<span class="profile-kind">Apple</span>
						</a>
						<a class="profile-link" href="./sktelecom_lte.mobileconfig">
							<span class="profile-name">SK Telecom</span>
							<span class="profile-kind">LTE</span>
						</a>
						<a class="profile-link" href="./sktelecom_5g.mobileconfig">
							<span class="profile-name">SK Telecom</span>
							<span class="profile-kind">5G</span>
						</a>
					</div>
				</section>

				<section class="carrier" aria-labelledby="lgu-title">
					<h2 id="lgu-title">LG U+</h2>
					<div class="profile-grid">
						<a class="profile-link" href="./lguplus.mobileconfig">
							<span class="profile-name">LG U+</span>
							<span class="profile-kind">APN</span>
						</a>
						<a class="profile-link" href="./lguplus_tethering.mobileconfig">
							<span class="profile-name">LG U+</span>
							<span class="profile-kind">Tethering</span>
						</a>
					</div>
				</section>
			</div>
		</main>
		<script>
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function () {
					navigator.serviceWorker.register("./service-worker.js");
				});

				document.querySelectorAll('a[href$=".mobileconfig"]').forEach(function (link) {
					link.addEventListener("click", function (event) {
						if (navigator.serviceWorker.controller) {
							return;
						}

						event.preventDefault();
						navigator.serviceWorker.ready.then(function () {
							window.location.href = link.href;
						});
					});
				});
			}
		</script>
	</body>
</html>
